# GitHub Pages configuration.
#
# Without this file, Pages renders README.md as unstyled HTML — no CSS at all.
# Picking a theme is what turns it into something that looks like a website.
title: Expense Tracker
description: Know where your money goes. A Flask API and an Expo / React Native app.
theme: jekyll-theme-cayman

# The theme's "Download .zip" buttons aren't useful for an app you build locally.
show_downloads: false

# Keep the published site to just the landing page and its images. Without this,
# Jekyll walks the whole app source (including node_modules) on every build.
exclude:
  - backend/
  - mobile/
  - LICENSE
  - "*.ps1"

# NOTE: do not set `kramdown.parse_block_html: true` here. It makes kramdown try
# to parse markdown inside block HTML, and because kramdown doesn't treat
# <summary> as a block element it mangles <details> — the closing tags leak out
# as literal text and the sections stop collapsing. The README uses plain
# markdown headings instead, which render correctly on both GitHub and Pages.
