name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run the suite from the Actions tab without pushing a commit.
  workflow_dispatch:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # The suite points DATABASE_URL at a throwaway file in conftest.py, so
        # it needs no services and never touches a real database.
        run: python -m pytest tests -v
